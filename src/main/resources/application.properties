spring.application.name=chatapp-withjpa

server.port=8091

spring.datasource.url=jdbc:postgresql://localhost:5432/chatapp-jpa
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

# --- Redis Session Configuration ---
# Redis connection
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#spring.session.redis.namespace=chatapp:sessions

#server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false

#persistent=false: Ensures that the session is not stored persistently across server restarts (in-memory only).
server.servlet.session.persistent=false
